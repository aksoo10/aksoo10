<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview GitHub Profile - Agung Aksa</title>
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #21262d;
    }
    .badge-tip {
      background: #1f6feb26;
      color: #58a6ff;
      border: 1px solid #1f6feb;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div>
        <strong style="color: #f0f6fc; font-size: 16px;">Preview GitHub Profile README.md</strong>
        <span style="color: #8b949e; font-size: 13px; margin-left: 8px;">(Tampilan Mode Gelap GitHub)</span>
      </div>
      <span class="badge-tip">Siap Copy-Paste / Push ke GitHub</span>
    </div>

    <article id="content" class="markdown-body" style="background-color: transparent;">
      <!-- Konten akan dimuat via JS -->
    </article>
  </div>

  <script>
    fetch('README.md?t=' + Date.now())
      .then(response => response.text())
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(err => {
        console.error('Gagal memuat README.md', err);
      });
  </script>
</body>
</html>
